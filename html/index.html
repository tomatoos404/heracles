<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hélaclès</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.css"
        integrity="sha256-LJzbbQFquR1Trwrwy++9x2Pl6ipfBZUR8Da0GGJ8Wfo=" crossorigin="" />
    <script type="importmap">
    {
        "imports": {
            "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.js"
        },
        "integrity": {
            "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.js": "sha256-wtAeAyJwpxq8jkj3LfBxdh3sPS3xw9kViJv+AtdXLDE="
        }
    }
    </script>
    <style>
        /* La carte a besoin d'une hauteur explicite */
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <div id="heracles">
            <h1>Héraclès</h1>
        </div>
    </header>

    <!-- FORMULAIRE INSCRIPTION -->
    <div id="panel">
        <div id="panel-left">
            <img src="" alt="">
        </div>

        <div id="form">

            <div id="form-connexion">

                <div id="form-input-connexion" class="form-group">
                    <input type="text" id="username" name="username" placeholder="username">
                    <input type="password" id="password" name="password" placeholder="password"
                        autocomplete="current-password" required>
                </div>

                <div id="form-div-plus" class="form-connexion">
                    <div id="form-btn-plus" class="btn-primary">S'inscrire</div>
                </div>

                <div id="form-input-inscription" class="form-group form-inscription">
                    <input type="text" id="prenom" name="prenom" placeholder="Prénom" autocomplete="given-name">
                    <input type="text" id="nom" name="nom" placeholder="Nom" autocomplete="family-name">
                    <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email">
                </div>

            </div>

            <div id="form-btn-action">
                <input type="button" value="Connexion" id="connexion-btn" class="btn-primary form-connexion">
                <input type="button" value="Inscription" id="inscription-btn" class="btn-primary form-inscription">
            </div>

            <div id="form-div-moins" class="form-inscription">
                <div id="form-btn-moins" class="btn-primary">Retour</div>
            </div>

        </div>
    </div>

    <div id="acceuil">
        <h1>Bienvenue</h1>
        <h2 id="nomUtilisateur"></h2>
        <input type="button" value="Déconnexion" id="deconnexion">
        <h3>Modifier le mot de passe</h3>
        <input type="password" name="password" id="input-modifier-password">
        <input type="button" value="Modifier" id="modifier-btn">

        <div id="map"></div>
        <!-- Leaflet est chargé uniquement via l'importmap (module) -->
        <script type="module" src="index.js"></script>
    </div>

    <div id="panel-users">
        <h2>Liste des utilisateurs</h2>
        <ul id="users">

        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
